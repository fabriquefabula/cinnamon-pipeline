name: Ingest Anticipated Releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count only, write nothing'
        type: boolean
        default: false
      min_person_votes:
        description: 'Vote floor for a notable name (default 2500 -> ~5,000 people)'
        type: string
        default: ''
      max_new:
        description: 'Hard cap on new films this run (default 150)'
        type: string
        default: ''
  # Narrow on purpose, same as the other ingests: only a change to this
  # job's own script or this file starts it, so a new or edited ingest is
  # exercised the moment it lands instead of waiting for the next cron,
  # and no unrelated commit in the repo triggers a TMDB sweep.
  push:
    branches: [main]
    paths:
      - 'ingest-anticipated.ts'
      - '.github/workflows/ingest-anticipated.yml'
  schedule:
    # Weekly rather than daily. The window runs a year ahead, so its
    # contents change on the timescale of announcements, not hours.
    #
    # Wednesday 05:00 UTC: clear of the Monday weekly ingest and an hour
    # before the daily upcoming sweep, so anything new is in the
    # catalogue before the popularity and rail jobs run over it.
    - cron: '0 5 * * 3'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run ingest-anticipated
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Unset on the cron and push runs, so the script's own defaults
          # apply and the run is live.
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_PERSON_VOTES: ${{ inputs.min_person_votes }}
          MAX_NEW: ${{ inputs.max_new }}
