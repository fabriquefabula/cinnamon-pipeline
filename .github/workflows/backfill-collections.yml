name: Film Series

# Records which series (TMDB collection) each film belongs to, so a
# recommendation list can hold at most a few films from one series.
# Run it once by hand to look up the whole catalogue (about half an
# hour). After that the daily schedule only looks up films that have
# never been checked -- the ones the ingests added since the last run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        default: 'false'
      movie_limit:
        description: 'Limit number of movies to process (blank = all)'
        required: false
  schedule:
    - cron: '20 5 * * *'

concurrency:
  group: film-series
  cancel-in-progress: false

jobs:
  film-series:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx backfill-collections.ts
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MOVIE_LIMIT: ${{ github.event.inputs.movie_limit }}
