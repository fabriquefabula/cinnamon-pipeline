name: Generate Collection Descriptions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log output, write nothing) -- defaults true, set false to actually write'
        required: false
        default: 'true'
      limit:
        description: 'Cap how many collections to process (blank = all that need one)'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run generate-collection-descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MULTIPLIER: ${{ github.event.inputs.limit }}
