name: Ingest Credits

on:
  schedule:
    # Sundays at 10:00 UTC -- one hour after weekly ingestion (09:00), so
    # new movies exist to fetch credits for. Independent of scoring-submit
    # (10:30) -- credits and scoring eligibility don't depend on each
    # other, both only need ingestion to have run first.
    - cron: '0 10 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        default: 'false'
      movie_limit:
        description: 'Limit number of movies to process (blank = all)'
        required: false

jobs:
  ingest-credits:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx ingest-credits.ts
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MOVIE_LIMIT: ${{ github.event.inputs.movie_limit }}
