name: Apply Editorial Copy

on:
  workflow_dispatch:
  # Runs the moment the wording changes: only a change to this job's own
  # script or this file starts it.
  push:
    branches: [main]
    paths:
      - 'apply-editorial-copy.ts'
      - '.github/workflows/apply-editorial-copy.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx apply-editorial-copy.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
