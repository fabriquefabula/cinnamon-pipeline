name: Refresh Popularity (Active TV)

on:
  workflow_dispatch:
  schedule:
    # Daily, 07:30 UTC -- half an hour after the movie refresh so the two
    # never contend for TMDB's rate limit, and still well before the
    # cluster and rail jobs later in the day.
    - cron: '30 7 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run refresh-tv-popularity
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
