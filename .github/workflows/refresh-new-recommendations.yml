name: Refresh New + Affected Recommendations (Incremental)

on:
  schedule:
    # Daily at 13:00 UTC -- after scoring-collect's every-3-hours polling
    # has had chances to pick up newly-completed batches, and after
    # assign-movie-clusters (11:00 UTC) so a new movie's tonal cluster
    # exists before its recommendations are computed (cluster_score in
    # the rail functions reads movie_cluster_assignments).
    - cron: '0 13 * * *'
  workflow_dispatch: {}

concurrency:
  # Shared with refresh-recommendations.yml's own group -- these were
  # previously uncoordinated. refresh-recommendations runs every 6h and
  # its own comment notes it routinely spans multiple hours, so the
  # 12:00 UTC run is very plausibly still going when this job triggers
  # at 13:00 UTC. Both call the same compute_* rail functions
  # (DELETE-then-INSERT, no ON CONFLICT) for the same newly-scored
  # movie when that happens -- confirmed directly this is what crashed
  # a run on a hidden_gem duplicate-key error, taking
  # refresh-affected-recommendations down with it since the workflow
  # step never got there. Queuing (cancel-in-progress: false) behind
  # whichever one started first instead of racing.
  group: refresh-recommendations
  cancel-in-progress: false

jobs:
  refresh-recommendations-incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # New movies get their own 5 rails first...
      - run: npm run refresh-new-recommendations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ...then existing movies close enough to those new arrivals in
      # embedding space get rechecked, in case a new movie now belongs
      # in their top 10. Running this second (not in parallel) means a
      # new movie is fully established before anything else's list
      # might start pointing at it. This replaces the need for a full
      # ~20h catalog recompute on any regular cadence -- both scripts
      # together touch only new movies plus their embedding-neighbors,
      # not the whole catalog.
      - run: npm run refresh-affected-recommendations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
