name: Refresh Recommendations (Full)

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours -- longer than the job's own 350min budget, so a
    # scheduled run can't start while the previous one is still going.
    - cron: '0 */6 * * *'

concurrency:
  group: refresh-recommendations
  cancel-in-progress: false

jobs:
  refresh-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run refresh-recommendations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
