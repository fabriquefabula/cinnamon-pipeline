name: Refresh Recommendations (Full)

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours -- longer than the job's own 350min budget, so a
    # scheduled run can't start while the previous one is still going.
    # This only RESUMES an in-progress run; it does not start a fresh
    # full recompute on its own (see EVENT_NAME handling in the
    # script) -- a completed run sits at is_running=false until a
    # human explicitly triggers workflow_dispatch for a new one.
    - cron: '0 */6 * * *'

concurrency:
  group: refresh-recommendations
  cancel-in-progress: false

jobs:
  refresh-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run refresh-recommendations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
