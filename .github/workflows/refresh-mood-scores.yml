name: Refresh Search Indexes

on:
  schedule:
    # Daily at 15:30 UTC -- after assign-tv-clusters (15:00) has placed
    # and railed anything newly scored, and before the health check at
    # 16:00, so a failure here is visible the same day.
    - cron: '30 15 * * *'
  # Also run it by hand straight after retuning anything in mood_axes:
  # every score for that axis is wrong until this completes, and nothing
  # about the site looks broken in the meantime. Same after any change to
  # the premise lexicon or association rules.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Three index rebuilds now, the largest of which grows with the
    # catalogue. The premise step is non-fatal by design, so a timeout
    # here would look like a clean run with a silently frozen index.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run refresh-mood-scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
