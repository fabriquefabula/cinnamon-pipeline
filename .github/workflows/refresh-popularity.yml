name: Refresh Popularity (Recent Movies)

on:
  workflow_dispatch:
  schedule:
    # Daily, 07:00 UTC -- before the other scheduled jobs (clusters at
    # 11:00, rails at 13:00), and popularity is a same-day metric per
    # TMDB's own definition, so a weekly cadence would leave it nearly as
    # stale as never refreshing it at all.
    - cron: '0 7 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run refresh-popularity
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
