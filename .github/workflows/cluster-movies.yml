name: Cluster Movies (Full)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (discovery + labeling only, no DB writes)'
        type: boolean
        default: false
      k:
        description: 'Number of clusters (blank = script default, 200)'
        required: false

jobs:
  cluster-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run cluster-movies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          K: ${{ github.event.inputs.k }}
