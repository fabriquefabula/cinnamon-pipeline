name: Submit to IndexNow

# Bing, DuckDuckGo, Yandex, Seznam and Copilot all read from one
# endpoint and act on a submission in hours. Google is not part of it --
# Google's own Indexing API is limited to job postings and livestreams,
# so for ordinary pages the sitemap remains the only lever there.
#
# Daily rather than on deploy, because a shelf is a row in a table: new
# ones appear with no deploy at all, and a schedule catches those while
# a deploy hook would not.
#
# This job now talks to api.indexnow.org directly instead of going
# through /api/indexnow on the site. That route sits behind
# REVALIDATE_SECRET and answered 503 for as long as the secret was unset
# in Vercel, which took the entire reach mechanism down for a reason
# that has nothing to do with IndexNow. Nothing in a submission is
# privileged: the key is public by design -- it is served at /<key>.txt
# precisely so that anyone can read it and confirm who controls the host
# -- so gating it behind a shared secret bought no security and cost
# availability. The route stays in the web repo for manual use.
#
# Two URL sets go out together:
#
#   1. Sitemap 0 in full: static pages, both genre taxonomies, every
#      collection and every shelf. A few hundred pages that each say
#      something a search engine cannot get elsewhere. Read from the
#      live sitemap rather than listed here, so a shelf added with an
#      INSERT is submitted the next morning with no change to this file.
#
#   2. A rotating slice of the old addresses: /movie/<uuid>, /tv/<uuid>
#      and /person/<uuid>, the sitemap files with ids 600-699. Every one
#      of them has answered a real 308 to its slug since 31 October 2026;
#      before that the redirect was made inside a static page and a
#      crawler was handed a 200. A redirect is one of the changes
#      IndexNow exists to report, and these are the addresses the
#      engines already hold, so this is how they learn where each page
#      lives now. ROTATING_SLICE a day, counted from 31 October: films
#      first, then series, then people, the whole set in about three
#      weeks, then round again until the site stops listing these files
#      (31 January 2027). A re-run on the same day repeats the same
#      slice rather than skipping ahead.
#
#      This slot used to rotate through the like-pages (ids 400-599).
#      Those carry noindex and left the sitemap on 31 October 2026, and
#      submitting a page that asks not to be indexed only spends the
#      engines' attention on nothing.

on:
  schedule:
    # 04:20 UTC, off the hour so it is not queued behind everything else
    # that runs at :00.
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect URLs and submit
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import date, datetime, timezone

          HOST = "www.cinnamondb.com"
          BASE = "https://" + HOST
          KEY = "4f167d4534a66d392db99db6cd7d68a4"
          INDEX = BASE + "/sitemap-index.xml"
          # One submission is meant to reach every participating engine,
          # but they verify the key independently and not at the same
          # moment. Trying more than one turns "this engine has not
          # fetched the key file yet" from a dead end into a detour.
          ENDPOINTS = [
              "https://api.indexnow.org/indexnow",
              "https://www.bing.com/indexnow",
              "https://yandex.com/indexnow",
              "https://search.seznam.cz/indexnow",
          ]

          # A first submission from a host IndexNow has never seen answers
          # 403 SiteVerificationNotCompleted and asks you to wait: the key
          # file is correct, it has simply not been fetched yet. That is a
          # retry rather than a failure, so the run waits it out instead
          # of leaving the whole thing to tomorrow's schedule.
          ROUNDS = 3
          BACKOFF = 45

          # IndexNow caps a single submission at 10,000 URLs. The core set
          # is about 500, so 9,000 old addresses fit beside it in one post.
          ROTATING_SLICE = 9000
          # Day 0 of the rotation: the day the old addresses began
          # answering a real 308. Counting from here rather than from the
          # day of the year puts the films and series in the first week.
          ROTATION_START = date(2026, 10, 31)
          # Sitemap 0 carries roughly 500 URLs. A collapse to double
          # digits means a table read came back empty, which otherwise
          # looks exactly like a healthy run.
          CORE_FLOOR = 100

          LOC = re.compile(r"<loc>\s*([^<]+?)\s*</loc>")


          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)


          def get(url, timeout=60):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "cinnamondb-indexnow/1 (+https://www.cinnamondb.com)"}
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.headers.get("Content-Type", ""), r.read().decode("utf-8", "replace")


          def locs(xml):
              # Next.js escapes & in sitemap URLs; genre slugs are already
              # percent-encoded, but unescaping is what makes that a fact
              # rather than a hope.
              return [html.unescape(u) for u in LOC.findall(xml)]


          # -- Preflight -------------------------------------------------
          # A wrong key file makes every submission answer 403 with no
          # explanation, so it is checked here where the failure names
          # itself rather than at the endpoint where it does not.
          try:
              status, ctype, body = get(BASE + "/" + KEY + ".txt", timeout=30)
          except urllib.error.HTTPError as e:
              fail("key file returned HTTP %s -- IndexNow cannot verify ownership" % e.code)
          except Exception as e:  # noqa: BLE001
              fail("key file unreachable: %s" % e)

          if body.strip() != KEY:
              fail("key file body is %r, expected the bare key" % body[:80])
          if "text/plain" not in ctype:
              fail("key file served as %r, must be text/plain" % ctype)
          print("Key file verifies.")

          # -- Sitemap index ---------------------------------------------
          try:
              _, _, index_xml = get(INDEX)
          except Exception as e:  # noqa: BLE001
              fail("sitemap index unreachable: %s" % e)

          children = locs(index_xml)
          if not children:
              fail("sitemap index listed no child sitemaps")
          print("Sitemap index lists %d children." % len(children))

          # -- Core set: sitemap 0 ---------------------------------------
          zero = [c for c in children if c.rstrip("/").endswith("/0.xml")]
          if not zero:
              fail("no /0.xml among the %d child sitemaps -- id ranges changed" % len(children))

          _, _, zero_xml = get(zero[0])
          core = locs(zero_xml)
          if len(core) < CORE_FLOOR:
              fail("sitemap 0 held only %d URLs, expected at least %d" % (len(core), CORE_FLOOR))
          print("Core set: %d URLs." % len(core))

          # -- Rotating set: the old addresses ---------------------------
          # ids 600-607 are films, 640-647 series, 660-675 people. Matched
          # on the file's own number rather than on its position in the
          # index, and read in numeric order, so the films come first
          # whatever order the index lists them in.
          old_children = []
          for c in children:
              tail = c.rstrip("/").rsplit("/", 1)[-1]
              num = tail[:-4] if tail.endswith(".xml") else ""
              if num.isdigit() and 600 <= int(num) < 700:
                  old_children.append((int(num), c))

          old = []
          old_seen = set()
          for _, c in sorted(old_children):
              try:
                  _, _, xml = get(c)
              except Exception as e:  # noqa: BLE001
                  print("::warning::could not read %s: %s" % (c, e))
                  continue
              for u in locs(xml):
                  if u not in old_seen:
                      old_seen.add(u)
                      old.append(u)

          rotating = []
          if old:
              day = max((datetime.now(timezone.utc).date() - ROTATION_START).days, 0)
              start = (day * ROTATING_SLICE) % len(old)
              # Wraps, so the final slice of a cycle is full rather than
              # a short tail that leaves the last few thousand addresses
              # submitted less often than the rest.
              doubled = old + old
              rotating = doubled[start : start + ROTATING_SLICE]
              print(
                  "Rotating set: %d of %d old addresses from %d files, offset %d (day %d)."
                  % (len(rotating), len(old), len(old_children), start, day)
              )
          else:
              print("::warning::no old-address sitemaps found -- submitting the core set only")

          # -- Submit ----------------------------------------------------
          seen = set()
          url_list = []
          for u in core + rotating:
              if u.startswith(BASE + "/") or u == BASE:
                  if u not in seen:
                      seen.add(u)
                      url_list.append(u)
              else:
                  # IndexNow rejects the whole submission with 422 if one
                  # URL is off-host, which is how the apex/www split would
                  # show up if it ever came back.
                  print("::warning::dropping off-host URL %s" % u)

          url_list = url_list[:10000]
          print("Submitting %d URLs." % len(url_list))

          payload = json.dumps(
              {
                  "host": HOST,
                  "key": KEY,
                  "keyLocation": BASE + "/" + KEY + ".txt",
                  "urlList": url_list,
              }
          ).encode("utf-8")


          def submit(endpoint):
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "replace")[:300]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:  # noqa: BLE001
                  return 0, str(e)[:300]


          last = "nothing attempted"
          for attempt in range(1, ROUNDS + 1):
              for endpoint in ENDPOINTS:
                  engine = endpoint.split("/")[2]
                  code, resp = submit(endpoint)
                  print("%s -> HTTP %s %s" % (engine, code, resp))
                  last = "%s HTTP %s %s" % (engine, code, resp)

                  # 200 and 202 are both success and the body is empty
                  # either way, so the status is the whole report.
                  if code in (200, 202):
                      print("Submitted %d URLs via %s." % (len(url_list), engine))
                      sys.exit(0)

                  # 422 is a URL that does not belong to the host, which no
                  # amount of waiting fixes and which another engine will
                  # reject identically.
                  if code == 422:
                      fail("%s rejected a URL as off-host: %s" % (engine, resp))

              if attempt < ROUNDS:
                  print("None accepted. Waiting %ds before round %d." % (BACKOFF, attempt + 1))
                  time.sleep(BACKOFF)

          fail(
              "no endpoint accepted the submission after %d rounds. Last: %s. "
              "SiteVerificationNotCompleted means the key file is correct but the engine "
              "has not fetched it yet -- adding www.cinnamondb.com in Bing Webmaster Tools "
              "makes that happen rather than waiting on it." % (ROUNDS, last)
          )
          PY
