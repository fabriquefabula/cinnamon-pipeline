name: Refresh TV Recommendations

on:
  schedule:
    # Every 6 hours. This RESUMES an in-progress run only — the script
    # exits immediately on a scheduled trigger when nothing is in
    # progress, so a completed run can't be restarted from scratch by
    # the next tick.
    #
    # Because of that, this workflow never picks up a newly scored show.
    # That job belongs to assign-tv-clusters.yml, which runs daily and
    # rails anything still missing neighbors.
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      rails:
        description: 'Rails to run (blank = all 5). e.g. darker_pick,more_accessible'
        required: false

concurrency:
  # Shared with assign-tv-clusters.yml, which rails newly scored shows
  # through the same compute_tv_* functions. Those DELETE-then-INSERT into
  # tv_neighbors with no ON CONFLICT, so two uncoordinated jobs touching
  # the same source row crash on a duplicate key — the failure already
  # observed on the movie side. A full run here can span hours, which makes
  # overlap with a daily job likely rather than theoretical.
  group: tv-recommendations
  cancel-in-progress: false

jobs:
  refresh-tv-recommendations:
    runs-on: ubuntu-latest
    # Platform hard ceiling is 360. The script's own TIME_BUDGET_MS is
    # 320 minutes, so it checkpoints and exits cleanly well before this
    # rather than racing the kill signal.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx refresh-tv-recommendations.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          # Empty on a scheduled run, so a resume always covers every
          # rail rather than inheriting a previous targeted dispatch.
          RAILS: ${{ github.event.inputs.rails }}
