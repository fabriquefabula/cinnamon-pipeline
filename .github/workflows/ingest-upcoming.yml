name: Ingest Upcoming Releases

on:
  workflow_dispatch:
  # Narrow on purpose: only a change to this job's own script or this
  # file starts it. A new or edited ingest is then exercised the moment
  # it lands instead of waiting for tomorrow's cron, and no unrelated
  # commit in the repo triggers a TMDB sweep.
  push:
    branches: [main]
    paths:
      - 'ingest-upcoming.ts'
      - '.github/workflows/ingest-upcoming.yml'
  schedule:
    # Daily, 06:00 UTC -- an hour before the movie popularity refresh, so
    # anything new that lands today is already in the catalogue when the
    # refresh and the rail jobs run over it.
    - cron: '0 6 * * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run ingest-upcoming
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
